<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Gérez vos réservations FlyGo."
    >

    <title>Mes réservations - FlyGo</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >
</head>

<body>

    <header class="site-header">

        <div class="container header-container">

            <a
                href="../index.html"
                class="logo"
            >
                FLYGO
            </a>


            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Ouvrir le menu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>


            <nav
                class="main-nav"
                id="mainNav"
            >

                <a href="flights.html">
                    Vols
                </a>

                <a href="hotels.html">
                    Hôtels
                </a>

                <a href="cars.html">
                    Voitures
                </a>

                <a href="#">
                    Voyages
                </a>

                <a
                    href="bookings.html"
                    class="active-nav-link"
                >
                    Mes réservations
                </a>

                <a
                    href="profile.html"
                    class="login-link"
                >
                    Connexion
                </a>

            </nav>

        </div>

    </header>


    <main class="bookings-page">

        <section class="bookings-hero">

            <div class="container">

                <span class="eyebrow">
                    ESPACE VOYAGEUR
                </span>

                <h1>
                    Mes réservations
                </h1>

                <p>
                    Retrouvez et consultez vos réservations
                    enregistrées sur cet appareil.
                </p>

            </div>

        </section>


        <section class="bookings-content">

            <div class="container">

                <div
                    id="bookingsList"
                    class="bookings-list"
                >
                </div>


                <section
                    id="emptyBookings"
                    class="empty-bookings hidden"
                >

                    <h2>
                        Aucune réservation
                    </h2>

                    <p>
                        Vous n'avez pas encore de réservation
                        enregistrée.
                    </p>

                    <a
                        href="../index.html"
                        class="select-flight booking-new-button"
                    >
                        Rechercher un vol
                    </a>

                </section>

            </div>

        </section>

    </main>


<script src="../js/app.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/bookings.js"></script>

</body>

</html>
