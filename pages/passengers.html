<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Informations des passagers - FlyGo."
    >

    <title>Informations des passagers - FlyGo</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <header class="site-header">

        <div class="container header-container">

            <a href="../index.html" class="logo">
                FLYGO
            </a>

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Ouvrir le menu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="main-nav" id="mainNav">

                <a href="flights.html">Vols</a>
                <a href="hotels.html">Hôtels</a>
                <a href="cars.html">Voitures</a>
                <a href="#">Voyages</a>
                <a href="bookings.html">Mes réservations</a>

                <a
                    href="profile.html"
                    class="login-link"
                >
                    Connexion
                </a>

            </nav>

        </div>

    </header>


    <main class="passengers-page">

        <section class="details-header">

            <div class="container">

                <a
                    href="seats.html"
                    class="back-link"
                >
                    Retour au choix du siège
                </a>

                <div id="passengerRoute"></div>

            </div>

        </section>


        <section class="passengers-content">

            <div class="container passengers-layout">

                <section class="passengers-main">

                    <div class="detail-panel">

                        <div class="panel-heading">

                            <div>

                                <span class="eyebrow">
                                    ÉTAPE 3
                                </span>

                                <h1>
                                    Informations des passagers
                                </h1>

                                <p class="form-introduction">
                                    Entrez les informations exactement
                                    comme elles apparaissent sur
                                    les documents de voyage.
                                </p>

                            </div>

                        </div>


                        <div id="passengersForm">
                        </div>

                    </div>


                    <div class="detail-panel">

                        <div class="panel-heading">

                            <div>

                                <span class="eyebrow">
                                    CONTACT
                                </span>

                                <h2>
                                    Coordonnées du voyageur principal
                                </h2>

                            </div>

                        </div>


                        <div class="form-grid">

                            <div class="form-field">

                                <label for="contactEmail">
                                    Adresse e-mail
                                </label>

                                <input
                                    type="email"
                                    id="contactEmail"
                                    placeholder="exemple@email.com"
                                    required
                                >

                            </div>


                            <div class="form-field">

                                <label for="contactPhone">
                                    Numéro de téléphone
                                </label>

                                <input
                                    type="tel"
                                    id="contactPhone"
                                    placeholder="+243..."
                                    required
                                >

                            </div>

                        </div>

                    </div>

                    <div
                        id="formError"
                        class="form-error hidden"
                        role="alert"
                    >
                    </div>

                </section>


                <aside class="booking-summary">

                    <div class="summary-heading">

                        <h2>
                            Résumé
                        </h2>

                    </div>


                    <div id="passengerSummary">
                    </div>


                    <button
                        type="button"
                        class="continue-button"
                        id="continuePassengers"
                    >
                        Continuer
                    </button>

                </aside>

            </div>

        </section>

    </main>


    <script src="../js/app.js"></script>
    <script src="../js/booking.js"></script>
    <script src="../js/passengers.js"></script>

</body>

</html>
