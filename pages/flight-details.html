<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Détails et tarifs du vol sélectionné."
    >

    <title>Détails du vol - FlyGo</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <header class="site-header">

        <div class="container header-container">

            <a href="../index.html" class="logo">
                FLYGO
            </a>

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Ouvrir le menu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="main-nav" id="mainNav">

                <a href="flights.html">Vols</a>
                <a href="hotels.html">Hôtels</a>
                <a href="cars.html">Voitures</a>
                <a href="#">Voyages</a>
                <a href="bookings.html">Mes réservations</a>
                <a href="profile.html" class="login-link">
                    Connexion
                </a>

            </nav>

        </div>

    </header>


    <main class="details-page">

        <section class="details-header">

            <div class="container">

                <a
                    href="flights.html"
                    class="back-link"
                >
                    Retour aux résultats
                </a>

                <div id="detailsRoute"></div>

            </div>

        </section>


        <section class="details-content">

            <div class="container details-layout">

                <div class="details-main">

                    <section class="detail-panel">

                        <div class="panel-heading">

                            <div>
                                <span class="eyebrow">
                                    VOTRE VOL
                                </span>

                                <h2 id="airlineName">
                                    Vol
                                </h2>
                            </div>

                            <span
                                class="flight-reference"
                                id="flightReference"
                            >
                            </span>

                        </div>


                        <div
                            class="flight-route-large"
                            id="flightRoute"
                        >
                        </div>


                        <div
                            class="flight-information"
                            id="flightInformation"
                        >
                        </div>

                    </section>


                    <section class="detail-panel">

                        <div class="panel-heading">

                            <div>
                                <span class="eyebrow">
                                    TARIFS
                                </span>

                                <h2>
                                    Choisissez votre tarif
                                </h2>
                            </div>

                        </div>


                        <div
                            class="fare-grid"
                            id="fareGrid"
                        >
                        </div>

                    </section>

                </div>


                <aside class="booking-summary">

                    <div class="summary-heading">
                        <h2>Votre réservation</h2>
                    </div>

                    <div
                        id="summaryContent"
                    >
                    </div>

                    <button
                        type="button"
                        class="continue-button"
                        id="continueButton"
                    >
                        Continuer
                    </button>

                </aside>

            </div>

        </section>

    </main>


    <script src="../js/app.js"></script>
    <script src="../js/booking.js"></script>

</body>

</html>
